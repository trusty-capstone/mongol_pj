<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유해조류 감지 알림</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .alert-box {
            width: 800px;
            height: 500px;
            border: 2px solid black;
            background-color: white;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .text-center {
            text-align: center;
        }

        .warning-text {
            color: red;
            font-size: 40px;
            font-weight: bold;
            margin: 0 0 15px 0;
            letter-spacing: -1px;
        }

        .bird-text {
            color: black;
            font-size: 36px;
            font-weight: bold;
            margin: 0;
            letter-spacing: -1px;
        }

        .sound-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;

            padding: 10px 15px;

            background-color: #e0e0e0;
            border: none;
            cursor: pointer;

            font-size: 18px;
            font-weight: bold;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: background-color 0.2s;
        }

        .sound-btn:hover {
            background-color: #cccccc;
        }

        .sound-btn svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>


<body>

    <div class="alert-box">

        <!-- 중앙 알림 메시지 -->
        <div class="text-center">
            <p class="warning-text">
                !!유해조류 감지!!
            </p>

            <!-- BirdNET 결과가 여기에 표시됨 -->
            <p class="bird-text" id="bird-name">
                분석 중...
            </p>
        </div>


        <!-- 우측 하단 천적 소리 출력 버튼 -->
        <button class="sound-btn" onclick="playPredatorSound()">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="black"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            천적 참매의 소리출력하기
        </button>


        <!-- 실제 재생될 천적 소리 -->
        <audio id="predator-audio" src="hawk_sound.mp3"></audio>

    </div>


    <script>
        // CSV 한 줄을 배열로 파싱
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (insideQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // 파일명에서 날짜/시간 파싱 (2026-08-13-birdnet-13:21:39.wav 지원하도록 수정)
        function getDateTimeFromFile(file) {
            // YYYY-MM-DD ... HH:MM:SS 또는 HH-MM-SS 추출
            const match = file.match(/(\d{4}-\d{2}-\d{2}).*?(\d{2})[: -](\d{2})[: -](\d{2})/);
            if (!match) return null;

            return new Date(`${match[1]}T${match[2]}:${match[3]}:${match[4]}`);
        }

        // BirdNET CSV 분석 함수
        async function loadLatestBird() {
            try {
                // BirdNET_CombinedTable.csv 또는 output.csv 읽어오기
                const response = await fetch('BirdNET_CombinedTable.csv');
                if (!response.ok) {
                    throw new Error('CSV 파일을 불러올 수 없습니다.');
                }

                const csvText = await response.text();
                const lines = csvText.trim().split(/\r?\n/);

                if (lines.length < 2) {
                    throw new Error('CSV 데이터가 비어 있습니다.');
                }

                // 헤더 컬럼 위치 찾기
                const headers = parseCSVLine(lines[0]);
                const fileIndex = headers.findIndex(h => h.toLowerCase().trim() === 'file');
                const confidenceIndex = headers.findIndex(h => h.toLowerCase().trim() === 'confidence');
                const commonNameIndex = headers.findIndex(h => h.toLowerCase().trim() === 'common name');

                if (confidenceIndex === -1 || commonNameIndex === -1) {
                    throw new Error('필수 컬럼(confidence / common name)을 찾지 못했습니다.');
                }

                const data = [];

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    const values = parseCSVLine(lines[i]);
                    const file = fileIndex !== -1 ? values[fileIndex] : 'unknown';
                    const confidence = parseFloat(values[confidenceIndex]);
                    const commonName = values[commonNameIndex];

                    if (isNaN(confidence) || !commonName) continue;

                    const dateTime = getDateTimeFromFile(file);

                    data.push({
                        file: file,
                        confidence: confidence,
                        commonName: commonName,
                        dateTime: dateTime || new Date(0) // 날짜 파싱 실패 시 기본값 부여
                    });
                }

                if (data.length === 0) {
                    throw new Error('분석 가능한 BirdNET 결과가 없습니다.');
                }

                // 1. 날짜 추출이 가능한 데이터 중 가장 최신 데이터 찾기
                const validTimeData = data.filter(d => d.dateTime.getTime() > 0);
                
                let targetData = data;
                if (validTimeData.length > 0) {
                    const latestDateTime = validTimeData.reduce(
                        (latest, row) => (row.dateTime > latest ? row.dateTime : latest),
                        validTimeData[0].dateTime
                    );
                    targetData = validTimeData.filter(
                        row => row.dateTime.getTime() === latestDateTime.getTime()
                    );
                }

                // 2. 대상 데이터 중 Confidence가 가장 높은 새 선택
                const bestResult = targetData.reduce(
                    (best, row) => (row.confidence > best.confidence ? row : best),
                    targetData[0]
                );

                console.log('최종 선택된 새:', bestResult);

                // 화면에 출력
                document.getElementById('bird-name').textContent = bestResult.commonName + ' 출현!';

            } catch (error) {
                console.error('BirdNET 결과 불러오기 실패:', error);
                document.getElementById('bird-name').textContent = '분석 결과 없음';
            }
        }

        function playPredatorSound() {
            const audio = document.getElementById('predator-audio');
            audio.currentTime = 0;
            audio.play().catch(error => {
                console.log('오디오 재생 실패:', error);
                alert('오디오 파일을 찾을 수 없거나 재생이 차단되었습니다.');
            });
        }

        window.addEventListener('DOMContentLoaded', loadLatestBird);
    </script>

</body>
</html>
