<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Avian Pest Monitoring System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
    padding: 24px;
}

/* 대형 카드 컨테이너 */
.card-container {
    width: 1280px;
    height: 780px;
    max-width: 92vw;
    max-height: 88vh;
    background: #ffffff;
    border-radius: 32px;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.12);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 40px;
    border: 3px solid transparent;
    transition: border-color 0.2s ease;
}

/* 유해조류 감지 시: 3px 레드 테두리 */
.card-container.threat-alert {
    border-color: #ef4444;
}

/* 일반 조류 감지 시: 3px 옐로우 테두리 */
.card-container.general-alert {
    border-color: #eab308;
}

/* Header Badge */
.header-badge {
    position: absolute;
    top: 36px;
    left: 45px;
    background-color: #f1f5f9;
    color: #475569;
    padding: 8px 22px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.8px;
}

/* View Sections */
.view-section {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    animation: fadeIn 0.35s ease-in-out forwards;
}

.view-section.active {
    display: flex;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Step 1: Initial View */
.start-icon {
    font-size: 120px;
    margin-bottom: 28px;
    line-height: 1;
}

.start-title {
    font-size: 54px;
    font-weight: 900;
    color: #0f172a;
    margin-bottom: 20px;
    letter-spacing: -1px;
    text-align: center;
}

.start-desc {
    font-size: 19px;
    color: #64748b;
    margin-bottom: 54px;
    text-align: center;
    line-height: 1.45;
    white-space: nowrap;
}

.btn-primary {
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    padding: 26px 64px;
    font-size: 26px;
    font-weight: 800;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(37, 99, 235, 0.35);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 18px;
}

.btn-primary:hover {
    background-color: #1d4ed8;
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(37, 99, 235, 0.45);
}

.btn-primary svg {
    width: 32px;
    height: 32px;
}

/* Step 2: Bird Loader & Terminal Console */
.bird-loader-container {
    position: relative;
    width: 96px;
    height: 96px;
    margin-top: 10px;
    margin-bottom: 16px;
}

.bird-base {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    fill: #e2e8f0;
}

.bird-fill-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    overflow: hidden;
    transition: height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

.bird-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 96px;
    height: 96px;
    fill: #2563eb;
}

.loading-text {
    font-size: 26px;
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 36px;
}

/* 우측 잉여 여백을 잘라낸 740px 폭의 터미널 콘솔 */
.log-terminal {
    width: 740px;
    max-width: 92%;
    height: 310px;
    background-color: #040812;
    border-radius: 16px;
    padding: 18px 22px;
    box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.8), 0 0 1px rgba(56, 189, 248, 0.2);
    border: 1px solid #1e293b;
    overflow-y: hidden;
    overflow-x: hidden;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.log-line {
    font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    display: block;
    width: 100%;
}

.log-line.system { color: #38bdf8; }
.log-line.dsp { color: #c084fc; }
.log-line.math { color: #f59e0b; }
.log-line.ai { color: #94a3b8; }
.log-line.matrix { color: #22c55e; font-family: monospace; font-size: 11.5px; opacity: 0.85; }
.log-line.success { color: #4ade80; font-weight: 700; background: rgba(74, 222, 128, 0.1); padding: 1px 6px; border-radius: 3px; }

/* Step 3: Detection Result View */
.status-pill {
    padding: 12px 38px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0.5px;
}

.status-pill svg {
    width: 24px;
    height: 24px;
}

/* 유해조류 뱃지 (레드) */
.status-pill.pest {
    background-color: #fee2e2;
    color: #dc2626;
    border: 2px solid #ef4444;
}

/* 일반 조류 뱃지 (옐로우) */
.status-pill.general {
    background-color: #fef9c3;
    color: #a16207;
    border: 2px solid #eab308;
}

.detected-bird-name {
    font-size: 64px;
    font-weight: 900;
    color: #0f172a;
    line-height: 1.15;
    margin-bottom: 26px;
    letter-spacing: -1px;
    text-align: center;
}

.detected-bird-name .sub-label {
    display: block;
    font-size: 48px;
    font-weight: 800;
    margin-top: 8px;
}

/* 유해조류일 때 이름 색상 */
.detected-bird-name.pest-name {
    color: #991b1b;
}
.detected-bird-name.pest-name .sub-label {
    color: #b91c1c;
}

/* 일반 조류일 때 이름 색상 */
.detected-bird-name.general-name {
    color: #854d0e;
}
.detected-bird-name.general-name .sub-label {
    color: #a16207;
}

.confidence-box {
    font-size: 19px;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 12px;
    margin-bottom: 46px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}

/* 유해조류 정보 박스 (레드) */
.confidence-box.pest-conf {
    background-color: #fef2f2;
    border: 2px solid #fecaca;
    color: #b91c1c;
}

/* 일반 조류 정보 박스 (옐로우) */
.confidence-box.general-conf {
    background-color: #fefce8;
    border: 2px solid #fef08a;
    color: #854d0e;
}

.action-buttons {
    display: flex;
    gap: 24px;
}

.btn-sound {
    padding: 22px 48px;
    font-size: 22px;
    font-weight: 700;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    background-color: #f1f5f9;
    color: #334155;
}

/* 유해조류 감지 시 솔리드 레드 버튼 */
.btn-sound.threat-cta {
    background-color: #dc2626;
    color: #ffffff;
    box-shadow: 0 4px 16px rgba(220, 38, 38, 0.25);
}

.btn-sound.threat-cta:hover {
    background-color: #b91c1c;
}

/* 일반 조류 감지 시 솔리드 옐로우/앰버 버튼 */
.btn-sound.general-cta {
    background-color: #d97706;
    color: #ffffff;
    box-shadow: 0 4px 16px rgba(217, 119, 6, 0.25);
}

.btn-sound.general-cta:hover {
    background-color: #b45309;
}

.btn-sound.playing {
    background-color: #1e293b !important;
    color: #ffffff !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15) !important;
}

.btn-sound svg {
    width: 28px;
    height: 28px;
}

.btn-secondary {
    background-color: transparent;
    color: #64748b;
    border: 2px solid #cbd5e1;
    padding: 22px 36px;
    font-size: 20px;
    font-weight: 600;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-secondary:hover {
    background-color: #f8fafc;
    border-color: #94a3b8;
    color: #334155;
}
</style>
</head>

<body>

<div class="card-container" id="main-card-container">
    <div class="header-badge">AI BIRD MONITORING SYSTEM</div>

    <!-- [STEP 1] Standby View -->
    <div class="view-section active" id="view-initial">
        <div class="start-icon">🦜</div>
        <h2 class="start-title">Outdoor Avian Acoustic Detection</h2>
        <p class="start-desc">Captures environmental audio and identifies avian species via deep learning neural network.</p>
        <button class="btn-primary" onclick="startRecordAndAnalyze()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="10 8 16 12 10 16 10 8"></polygon>
            </svg>
            Start Audio Capture & Analysis
        </button>
    </div>

    <!-- [STEP 2] Loading & Synchronized Cyber Stream Log View -->
    <div class="view-section" id="view-loading">
        <div class="bird-loader-container">
            <svg class="bird-base" viewBox="0 0 24 24">
                <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
            </svg>

            <div class="bird-fill-wrapper" id="bird-fill-wrapper">
                <svg class="bird-fill" viewBox="0 0 24 24">
                    <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
                </svg>
            </div>
        </div>

        <h3 class="loading-text" id="loading-title">Executing Deep Neural Inference Pipeline...</h3>

        <!-- Terminal Console (너비 740px로 최적화) -->
        <div class="log-terminal" id="log-terminal"></div>
    </div>

    <!-- [STEP 3] Detection Result View -->
    <div class="view-section" id="view-result">
        <div class="status-pill pest" id="status-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span id="status-badge-text">CRITICAL ALERT // PEST DETECTED!</span>
        </div>
        
        <h1 class="detected-bird-name" id="bird-name">No Bird<span class="sub-label">Detected!</span></h1>
        
        <div class="confidence-box pest-conf" id="confidence-box">AI Confidence: 0.0%</div>

        <div class="action-buttons">
            <button class="btn-secondary" onclick="resetToInitial()">
                ↺ Record Again
            </button>
            <button class="btn-sound" id="sound-toggle-btn" onclick="togglePredatorSound()">
                <span id="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </span>
                <span id="btn-text">Deploy Deterrent Audio</span>
            </button>
        </div>
    </div>
</div>

<script>
let currentDetectedBird = '';
let currentConfidence = 0;
let isPlaying = false;
let streamInterval = null;
let currentFillPercent = 0;

const PEST_KEYWORDS = [
    'sparrow', '참새',
    'magpie', '까치',
    'rook', '떼까마귀',
    'crow', '까마귀',
    'bulbul', '직박구리'
];

function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
}

function resetToInitial() {
    if (isPlaying) togglePredatorSound();
    clearInterval(streamInterval);
    currentFillPercent = 0;
    document.getElementById('bird-fill-wrapper').style.height = '0%';
    document.getElementById('loading-title').textContent = 'Executing Deep Neural Inference Pipeline...';
    document.getElementById('log-terminal').innerHTML = '';
    
    const cardContainer = document.getElementById('main-card-container');
    cardContainer.classList.remove('threat-alert', 'general-alert');
    
    const soundBtn = document.getElementById('sound-toggle-btn');
    soundBtn.classList.remove('threat-cta', 'general-cta');
    
    const confBox = document.getElementById('confidence-box');
    confBox.className = 'confidence-box';
    
    const birdNameElem = document.getElementById('bird-name');
    birdNameElem.className = 'detected-bird-name';
    
    showView('view-initial');
}

const delay = ms => new Promise(res => setTimeout(res, ms));

function appendLogLine(text, type = 'normal') {
    const terminal = document.getElementById('log-terminal');
    const now = new Date();
    const timeStr = now.toTimeString().split(' ')[0] + "." + String(now.getMilliseconds()).padStart(3, '0');
    
    const line = document.createElement('div');
    line.className = `log-line ${type}`;
    line.innerHTML = `<span style="color:#475569;">[${timeStr}]</span> ${text}`;
    terminal.appendChild(line);

    if (terminal.childNodes.length > 14) {
        terminal.removeChild(terminal.firstChild);
    }
}

// 0.1초(100ms) 간격으로 로그 출력
function startSynchronizedLogStream() {
    const terminal = document.getElementById('log-terminal');
    const wrapper = document.getElementById('bird-fill-wrapper');
    terminal.innerHTML = '';
    currentFillPercent = 0;
    wrapper.style.height = '0%';
    
    const pool = [
        () => ({ t: `ALSA::DMA_STREAM_INGEST: Buffer [0x${Math.floor(Math.random()*0xFFFFFF).toString(16).toUpperCase()}] 1024 frames synced (Peak: -${(Math.random()*15+8).toFixed(2)}dBFS)`, c: 'system' }),
        () => ({ t: `DSP_IIR::BUTTERWORTH_ORDER4: Filtering low-rumble [Fc=120Hz] -> Attenuation: -${(Math.random()*10+20).toFixed(1)}dB`, c: 'dsp' }),
        () => ({ t: `STFT_CORE::N_FFT=2048: Frame #${Math.floor(Math.random()*450)} Centroid=${Math.floor(Math.random()*3000+2500)}Hz | Flux=${(Math.random()*0.8).toFixed(4)}`, c: 'dsp' }),
        () => ({ t: `MEL_FILTERBANK::MATRIX_PROD: Band[${Math.floor(Math.random()*64)}/64] Energy=${(Math.random()*-35-15).toFixed(2)}dB | Q-factor=${(Math.random()*1.5+0.5).toFixed(3)}`, c: 'dsp' }),
        () => ({ t: `TENSOR_ENGINE::CONV2D_RESNET: Layer_${Math.floor(Math.random()*16)} Output Dim [1, 64, 56, 56] FLOPs=${(Math.random()*0.4+0.8).toFixed(2)}G`, c: 'ai' }),
        () => ({ t: `ATTENTION_HEAD::VEC_DOT_PROD: Head_0${Math.floor(Math.random()*8)} Softmax Attn Score=${(Math.random()*0.95+0.05).toFixed(5)}`, c: 'ai' }),
        () => ({ t: `EMBEDDING_VEC::SPATIAL_POOL: Norm-L2=${(Math.random()*0.2+0.8).toFixed(4)} | Feature Distances Matrix Calculated`, c: 'ai' }),
        () => ({ t: `MATH::LOGIT_EVAL: P(y_${Math.floor(Math.random()*3250)}) = exp(${ (Math.random()*6+2).toFixed(3) }) / Σexp(z) | CrossEntropy=${(Math.random()*0.05).toFixed(4)}`, c: 'math' }),
        () => ({ t: `TAXONOMY_MAP::LOGIT_SORT: TopCandidateScore=${(Math.random()*0.3+0.65).toFixed(4)} | MarginToTop2=+${(Math.random()*3+2).toFixed(2)}`, c: 'math' }),
        () => ({ t: `KERNEL_MEM_OP: [0x${Math.floor(Math.random()*0xFFFFFF).toString(16).toUpperCase()}] -> Tensor Pipeline In-Flight Sync (OK)`, c: 'matrix' })
    ];

    clearInterval(streamInterval);
    streamInterval = setInterval(() => {
        const randItem = pool[Math.floor(Math.random() * pool.length)]();
        appendLogLine(randItem.t, randItem.c);

        if (currentFillPercent < 75) {
            currentFillPercent += 1.5;
            wrapper.style.height = `${currentFillPercent}%`;
        }
    }, 100);
}

// 녹음 & 분석 실행
async function startRecordAndAnalyze() {
    const RECORD_DURATION = 5;
    showView('view-loading');
    
    startSynchronizedLogStream();
    
    const fetchPromise = fetch('/api/record-and-analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ duration: RECORD_DURATION })
    }).then(r => r.json());

    try {
        const result = await fetchPromise;
        clearInterval(streamInterval);

        if (result.status === 'success') {
            await loadLatestBird();
            
            const confPercent = (currentConfidence * 100).toFixed(1);
            
            appendLogLine(`CRITICAL_DECISION -> Target Species Matched: [${currentDetectedBird}] (P=${confPercent}%)`, 'success');
            appendLogLine(`ACTUATOR_DISPERSAL -> Bioacoustic Deterrent Signal Routed to Subsystem`, 'success');
            
            document.getElementById('loading-title').textContent = 'Inference Complete! Finalizing...';
            const wrapper = document.getElementById('bird-fill-wrapper');
            wrapper.style.height = '100%';

            await delay(550);
            showView('view-result');
        } else {
            alert('Analysis Failed: ' + result.message);
            showView('view-initial');
        }
    } catch (error) {
        clearInterval(streamInterval);
        console.error(error);
        alert('Error communicating with Raspberry Pi server.');
        showView('view-initial');
    }
}

// CSV Parsing
function parseCSVLine(line) {
    const result = [];
    let current = '';
    let insideQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
            if (insideQuotes && line[i + 1] === '"') {
                current += '"'; i++;
            } else {
                insideQuotes = !insideQuotes;
            }
        } else if (char === ',' && !insideQuotes) {
            result.push(current.trim()); current = '';
        } else {
            current += char;
        }
    }
    result.push(current.trim());
    return result;
}

function getDateTimeFromFile(file) {
    const match = file.match(/(\d{4}-\d{2}-\d{2}).*?(\d{2})[: -](\d{2})[: -](\d{2})/);
    if (!match) return null;
    return new Date(`${match[1]}T${match[2]}:${match[3]}:${match[4]}`);
}

async function loadLatestBird() {
    try {
        const response = await fetch('BirdNET_CombinedTable.csv?nocache=' + Date.now());
        if (!response.ok) throw new Error('Unable to load CSV file.');

        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);
        if (lines.length < 2) throw new Error('CSV data is empty.');

        const headers = parseCSVLine(lines[0]);
        const fileIndex = headers.findIndex(h => h.toLowerCase().trim() === 'file');
        const confidenceIndex = headers.findIndex(h => h.toLowerCase().trim() === 'confidence');
        const commonNameIndex = headers.findIndex(h => h.toLowerCase().trim() === 'common name');

        const data = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = parseCSVLine(lines[i]);
            const file = fileIndex !== -1 ? values[fileIndex] : 'unknown';
            const confidence = parseFloat(values[confidenceIndex]);
            const commonName = values[commonNameIndex];

            if (isNaN(confidence) || !commonName) continue;

            const dateTime = getDateTimeFromFile(file);
            data.push({
                file: file,
                confidence: confidence,
                commonName: commonName,
                dateTime: dateTime || new Date(0)
            });
        }

        if (data.length === 0) throw new Error('No data found');

        const validTimeData = data.filter(d => d.dateTime.getTime() > 0);
        let targetData = data;
        if (validTimeData.length > 0) {
            const latestDateTime = validTimeData.reduce(
                (latest, row) => (row.dateTime > latest ? row.dateTime : latest),
                validTimeData[0].dateTime
            );
            targetData = validTimeData.filter(
                row => row.dateTime.getTime() === latestDateTime.getTime()
            );
        }

        const bestResult = targetData.reduce(
            (best, row) => (row.confidence > best.confidence ? row : best),
            targetData[0]
        );

        currentDetectedBird = bestResult.commonName.trim();
        currentConfidence = bestResult.confidence;

        document.getElementById('bird-name').innerHTML = `${currentDetectedBird}<span class="sub-label">Detected!</span>`;

        const cardContainer = document.getElementById('main-card-container');
        const pillElement = document.getElementById('status-pill');
        const badgeTextElement = document.getElementById('status-badge-text');
        const soundBtn = document.getElementById('sound-toggle-btn');
        const soundBtnText = document.getElementById('btn-text');
        const confBox = document.getElementById('confidence-box');
        const birdNameElem = document.getElementById('bird-name');
        
        const isPest = PEST_KEYWORDS.some(keyword => 
            currentDetectedBird.toLowerCase().includes(keyword.toLowerCase())
        );

        if (isPest) {
            cardContainer.className = 'card-container threat-alert';
            pillElement.className = 'status-pill pest';
            badgeTextElement.textContent = 'CRITICAL ALERT // PEST DETECTED!';
            
            birdNameElem.className = 'detected-bird-name pest-name';
            confBox.className = 'confidence-box pest-conf';
            confBox.textContent = `THREAT LEVEL: HIGH | AI Confidence: ${(currentConfidence * 100).toFixed(1)}%`;
            
            soundBtn.className = 'btn-sound threat-cta';
            soundBtnText.textContent = 'Deploy Deterrent Audio';
        } else {
            cardContainer.className = 'card-container general-alert';
            pillElement.className = 'status-pill general';
            badgeTextElement.textContent = 'AVIAN SPECIES DETECTED';
            
            birdNameElem.className = 'detected-bird-name general-name';
            confBox.className = 'confidence-box general-conf';
            confBox.textContent = `THREAT LEVEL: LOW | AI Confidence: ${(currentConfidence * 100).toFixed(1)}%`;
            
            soundBtn.className = 'btn-sound general-cta';
            soundBtnText.textContent = 'Play Predator Sound';
        }

    } catch (error) {
        console.error('BirdNET parse error:', error);
        currentDetectedBird = '';
        currentConfidence = 0;
        document.getElementById('bird-name').innerHTML = `No Bird<span class="sub-label">Detected!</span>`;
        document.getElementById('confidence-box').textContent = 'AI Confidence: 0.0%';
    }
}

const SPEAKER_ICON = `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 5"></polygon>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
</svg>`;

const MUTE_ICON = `
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 5"></polygon>
    <line x1="23" y1="9" x2="17" y2="15"></line>
    <line x1="17" y1="9" x2="23" y2="15"></line>
</svg>`;

async function togglePredatorSound() {
    const btn = document.getElementById('sound-toggle-btn');
    const iconSpan = document.getElementById('btn-icon');
    const textSpan = document.getElementById('btn-text');

    if (!isPlaying) {
        try {
            const response = await fetch('/api/play-sound', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bird: currentDetectedBird })
            });

            const result = await response.json();
            if (result.status === 'success') {
                isPlaying = true;
                btn.classList.add('playing');
                iconSpan.innerHTML = MUTE_ICON;
                textSpan.textContent = 'Mute / Stop Audio';
            } else {
                alert('Playback Failed: ' + result.message);
            }
        } catch (error) {
            console.error('Server communication failure:', error);
            alert('Unable to communicate with the server.');
        }
    } else {
        try {
            const response = await fetch('/api/stop-sound', { method: 'POST' });
            const result = await response.json();

            if (result.status === 'success') {
                isPlaying = false;
                btn.classList.remove('playing');
                iconSpan.innerHTML = SPEAKER_ICON;
                
                const isPest = PEST_KEYWORDS.some(k => currentDetectedBird.toLowerCase().includes(k.toLowerCase()));
                if (isPest) {
                    btn.className = 'btn-sound threat-cta';
                    textSpan.textContent = 'Deploy Deterrent Audio';
                } else {
                    btn.className = 'btn-sound general-cta';
                    textSpan.textContent = 'Play Predator Sound';
                }
            }
        } catch (error) {
            console.error('Server communication failure:', error);
            alert('Unable to communicate with the server.');
        }
    }
}
</script>
